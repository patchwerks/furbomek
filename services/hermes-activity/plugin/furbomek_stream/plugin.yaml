name: furbomek_stream
version: 0.1.0
description: "Read-only public activity projection for Furb-o-Mek. Returns no tool directives and starts no desktop or device services. Live desktop screenshot publication is not qualified."
author: patchwerks/furbomek
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - pre_llm_call
  - post_llm_call
  - on_session_start
  - on_session_end
  - pre_approval_request
  - post_approval_response
