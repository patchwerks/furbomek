[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "furbomek-embodiment-gateway"
version = "0.1.0"
description = "Read-only stock Freenove TCP MCP boundary for Furb-o-Mek"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4,<5",
    "mcp==1.30.0",
    "pydantic>=2,<3",
    "pyserial==3.5",
    "pyyaml==6.0.3",
    "typer>=0.16,<1",
]

[project.scripts]
furbomek-gateway = "furbomek_gateway.cli:main"
furbomek-mcp = "furbomek_gateway.cli:main"

[dependency-groups]
dev = [
    "basedpyright>=1.31,<2",
    "pytest>=8,<10",
    "ruff>=0.13,<1",
    "types-pyserial>=3.5.0.20260712",
    "types-pyyaml>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/furbomek_gateway"]

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.12"
pythonPlatform = "All"
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv", "**/build", "**/dist"]
reportUnusedCallResult = "warning"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedVariable = "error"
reportMissingParameterType = "error"
reportPrivateUsage = "error"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "ISC001",
    "D203",
    "D213",
    "CPY001",
    "FBT001",
    "FBT002",
    "TD002",
    "TD003",
    "FIX002",
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ARG", "PLR2004", "S610", "SLF001", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]
