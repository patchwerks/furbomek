name: CI scratch tmpfs lifetime probe
on:
  push:
    branches: ['work/4-ci-scratch-qualification']
    paths: ['.github/workflows/ci-scratch-lifetime-probe.yml']
permissions:
  contents: read
jobs:
  storage-primitive:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Characterize tmpfs lifetime with and without a keeper
        shell: bash
        run: |
          set -euo pipefail
          # Fixed inline storage probe only: no checkout or candidate execution.
          image=python:3.12.11-bookworm@sha256:1b48a1b13ec678be8d84974541cc007d4367aaf01f985231daad1a940106efc0
          version=$(docker version --format '{{.Server.Version}}')
          [[ $version =~ ^([0-9]+)\.[0-9]+\.[0-9]+$ ]] || {
            echo 'FAIL: a stable Docker server version is required' >&2
            exit 1
          }
          (( BASH_REMATCH[1] >= 28 )) || {
            echo 'FAIL: Docker server 28 or newer is required' >&2
            exit 1
          }
          printf 'PASS: Docker server %s is stable and >=28\n' "$version"
          [[ $GITHUB_RUN_ID =~ ^[0-9]+$ && $GITHUB_RUN_ATTEMPT =~ ^[0-9]+$ ]]
          prefix="scratch-lifetime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          volume="$prefix-volume"
          keeper="$prefix-keeper"
          probe="$prefix-probe"
          # Refuse collisions before registering cleanup for these owned names.
          for name in "$keeper" "$probe"; do
            if docker container inspect "$name" >/dev/null 2>&1; then
              echo 'FAIL: probe container name already exists' >&2
              exit 1
            fi
          done
          if docker volume inspect "$volume" >/dev/null 2>&1; then
            echo 'FAIL: probe volume name already exists' >&2
            exit 1
          fi
          cleanup() {
            docker rm -f "$probe" "$keeper" >/dev/null 2>&1 || true
            docker volume rm "$volume" >/dev/null 2>&1 || true
          }
          trap 'status=$?; cleanup; exit "$status"' EXIT
          docker pull "$image"
          docker volume create --driver local --opt type=tmpfs --opt device=tmpfs \
            --opt o=size=4g,uid=1000,gid=1000,mode=0700 "$volume" >/dev/null
          worker=(docker run --rm --name "$probe" --pull never
            --network none --read-only --user 1000:1000
            --cap-drop ALL --security-opt no-new-privileges
            --memory 64m --cpus 0.1 --pids-limit 16
            --mount "type=volume,source=$volume,target=/scratch")
          "${worker[@]}" "$image" /bin/sh -eu -c '
            test "$(id -u)" = 1000
            test ! -e /scratch/marker
            printf "%s\n" without-keeper > /scratch/marker
            test "$(cat /scratch/marker)" = without-keeper
          '
          "${worker[@]}" "$image" /bin/sh -eu -c 'test ! -e /scratch/marker'
          echo 'PASS: without keeper, marker disappears between ephemeral workers (expected failure mode)'
          docker run -d --name "$keeper" --pull never \
            --network none --read-only --user 1000:1000 \
            --cap-drop ALL --security-opt no-new-privileges \
            --memory 32m --cpus 0.1 --pids-limit 8 \
            --mount "type=volume,source=$volume,target=/scratch" \
            "$image" /bin/sleep infinity >/dev/null
          test "$(docker inspect --format '{{.State.Running}}' "$keeper")" = true
          "${worker[@]}" "$image" /bin/sh -eu -c '
            test ! -e /scratch/marker
            printf "%s\n" with-keeper > /scratch/marker
          '
          "${worker[@]}" "$image" /bin/sh -eu -c 'test "$(cat /scratch/marker)" = with-keeper'
          test "$(docker inspect --format '{{.State.Running}}' "$keeper")" = true
          echo 'PASS: with keeper, marker persists between ephemeral workers'
          docker rm -f "$keeper" >/dev/null
          "${worker[@]}" "$image" /bin/sh -eu -c 'test ! -e /scratch/marker'
          echo 'PASS: removing the last keeper discards tmpfs contents'
          docker volume rm "$volume" >/dev/null
          volumes=$(docker volume ls --format '{{.Name}}')
          if printf '%s\n' "$volumes" | grep -Fxq -- "$volume"; then
            echo 'FAIL: owned volume still exists after removal' >&2
            exit 1
          fi
          echo 'PASS: owned volume removed and absence verified'
          echo 'PASS: storage primitive only; no helper, product or policy acceptance claimed'
  helper-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.13.6'
          enable-cache: false
      - name: Prepare trusted uv and pinned image
        shell: bash
        run: |
          set -euo pipefail
          probe_tools=$(mktemp -d /tmp/uv-probe-tools.XXXXXXXX)
          cp "$(command -v uv)" "$probe_tools/uv"
          chmod 755 "$probe_tools" "$probe_tools/uv"
          echo "PROBE_TOOLS=$probe_tools" >> "$GITHUB_ENV"
          docker pull python:3.12.11-bookworm@sha256:1b48a1b13ec678be8d84974541cc007d4367aaf01f985231daad1a940106efc0
      - name: Check out exact helper candidate as fixture input
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 'fb93566ffbaf4cfb1b8b52716522ae6c86aae67b'
          path: helper-candidate
          persist-credentials: false
      - name: Copy only helper source and tests into sanitized input
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C helper-candidate rev-parse HEAD)" = fb93566ffbaf4cfb1b8b52716522ae6c86aae67b
          helper_source=$(mktemp -d "$RUNNER_TEMP/helper-fixture-source.XXXXXXXX")
          mkdir -p "$helper_source/tools"
          cp -R helper-candidate/tools/ci "$helper_source/tools/ci"
          cp -R helper-candidate/tools/tests "$helper_source/tools/tests"
          chmod -R a+rX "$helper_source"
          echo "HELPER_FIXTURE_SOURCE=$helper_source" >> "$GITHUB_ENV"
      - name: Qualify exact helper fixtures offline without Docker access
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i --pull never --network none --read-only --user 65534:65534 \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 128 \
            --cpus 2 --memory 1g \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=256m \
            --mount "type=bind,src=$PROBE_TOOLS,dst=/tools,readonly" \
            --mount "type=bind,src=$HELPER_FIXTURE_SOURCE,dst=/candidate,readonly" \
            --workdir /candidate \
            python:3.12.11-bookworm@sha256:1b48a1b13ec678be8d84974541cc007d4367aaf01f985231daad1a940106efc0 \
            env -i PATH=/tools:/usr/local/bin:/usr/bin:/bin HOME=/tmp/home \
            UV_OFFLINE=1 UV_PYTHON_DOWNLOADS=never UV_CACHE_DIR=/tmp/cache \
            PYTHONDONTWRITEBYTECODE=1 \
            /bin/bash -eu -c 'umask 077; mkdir -p "$HOME"; exec python -I -' <<'PY'
          from pathlib import Path
          import sys
          import unittest

          assert not Path('/var/run/docker.sock').exists()
          assert not Path('/run/docker.sock').exists()
          suite = unittest.defaultTestLoader.discover('tools/tests', pattern='test_*.py')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          print('Fixture test count:', result.testsRun, flush=True)
          print('Skipped fixtures:', result.skipped, flush=True)
          qualified = result.wasSuccessful() and not result.skipped and result.testsRun == 30
          if qualified:
              print('PASS: 30 isolated helper fixtures, zero skips; no policy activation or full worker qualification.', flush=True)
          else:
              print('FAIL: fixture failures, skips, or test count other than 30.', flush=True)
          sys.exit(0 if qualified else 1)
          PY
