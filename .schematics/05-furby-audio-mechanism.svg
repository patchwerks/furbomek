<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Furby audio and mechanism evidence blueprint</title>
  <desc id="desc">Patent-style line drawing separating a patent-described 1998 speech and motor architecture, actual-unit unknowns, and the proposed Furb-o-Mek TTS, OBS, local playback, and facial timing architecture.</desc>
  <defs>
    <style>
      .bg{fill:#071116}.panel{fill:#0b171d;stroke:#87a7b2;stroke-width:2}.cyan{stroke:#2de2e6}.white{stroke:#d9edf2}.muted{stroke:#71909b}.dash{stroke-dasharray:10 8}.line{fill:none;stroke-width:2.5}.thin{fill:none;stroke-width:1.5}.node{fill:#0d1c22;stroke:#d9edf2;stroke-width:2}.nodeC{fill:#0b2024;stroke:#2de2e6;stroke-width:2.5}.unknown{fill:#111b20;stroke:#71909b;stroke-width:2;stroke-dasharray:8 6}.txt{fill:#d9edf2;font-family:"Berkeley Mono","Ioskeley Mono",Hermit,"Caskaydia Cove",ui-monospace,SFMono-Regular,Menlo,monospace;font-size:18px}.small{font-size:15px}.tiny{font-size:13px}.head{font-size:30px;font-weight:700;letter-spacing:2px}.sub{font-size:20px;font-weight:700;letter-spacing:1px}.ref{fill:#2de2e6;font-size:15px;font-weight:700}.note{fill:#9bb3bb;font-size:14px}.cyanFill{fill:#2de2e6}.arrow{marker-end:url(#arrow)}.arrowW{marker-end:url(#arrowW)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#2de2e6"/></marker>
    <marker id="arrowW" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#d9edf2"/></marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16313a" stroke-width="1"/></pattern>
  </defs>
  <rect class="bg" width="1600" height="1000"/>
  <rect width="1600" height="1000" fill="url(#grid)" opacity="0.55"/>
  <text class="txt head" x="60" y="62">SHEET 05 — FURBY AUDIO + COUPLED MECHANISM</text>
  <text class="txt note" x="60" y="91">EVIDENCE BLUEPRINT • NOT A VERIFIED WIRING DRAWING • 2026-09-21</text>

  <rect class="panel" x="45" y="120" width="1510" height="330" rx="6"/>
  <text class="txt sub" x="70" y="156">A — PATENT-DESCRIBED 1998-ERA EMBODIMENT</text>
  <text class="txt note" x="70" y="180">US6544098B1 / US6149490A / US6497607B1 • illustrative architecture, not proof of installed unit</text>

  <rect class="node" x="75" y="215" width="245" height="90" rx="4"/>
  <text class="txt" x="98" y="250">INFORMATION</text><text class="txt" x="98" y="276">PROCESSOR</text><text class="txt ref" x="285" y="298">[101]</text>
  <rect class="node" x="410" y="215" width="285" height="90" rx="4"/>
  <text class="txt" x="435" y="246">TI TSP50C04</text><text class="txt small" x="435" y="274">LPC + 10-bit DAC</text><text class="txt ref" x="655" y="298">[103]</text>
  <rect class="node" x="790" y="215" width="235" height="90" rx="4"/>
  <path class="line white" d="M835 261h22l16-22v44l-16-22h-22zM880 244q28 17 0 34M893 234q45 27 0 54"/>
  <text class="txt small" x="925" y="251">32 Ω</text><text class="txt small" x="925" y="276">SPEAKER</text><text class="txt ref" x="990" y="298">[104]</text>
  <path class="line white arrowW" d="M320 260H410"/><text class="txt tiny" x="325" y="204">D0–D3 + CTS [102]</text>
  <path class="line white arrowW" d="M695 260H790"/>

  <rect class="node" x="75" y="340" width="205" height="70" rx="4"/><text class="txt small" x="98" y="370">MOTOR DRIVE</text><text class="txt ref" x="242" y="401">[111]</text>
  <rect class="node" x="345" y="340" width="205" height="70" rx="4"/><text class="txt small" x="369" y="370">REV. MOTOR</text><text class="txt ref" x="512" y="401">[112]</text>
  <rect class="node" x="615" y="340" width="230" height="70" rx="4"/><text class="txt small" x="640" y="370">GEAR / CAM SHAFT</text><text class="txt ref" x="807" y="401">[113]</text>
  <rect class="node" x="910" y="340" width="240" height="70" rx="4"/><text class="txt small" x="936" y="370">COUPLED FACE</text><text class="txt ref" x="1112" y="401">[114]</text>
  <rect class="node" x="1220" y="325" width="280" height="85" rx="4"/><text class="txt small" x="1245" y="354">POSITION WHEEL /</text><text class="txt small" x="1245" y="379">OPTICAL SENSOR</text><text class="txt ref" x="1460" y="401">[115]</text>
  <path class="line white arrowW" d="M280 375H345"/><path class="line white arrowW" d="M550 375H615"/><path class="line white arrowW" d="M845 375H910"/>
  <path class="thin white arrowW" d="M1220 325V315H360V225H320"/>

  <rect class="panel" x="45" y="475" width="530" height="235" rx="6"/>
  <text class="txt sub" x="70" y="511">B — ACTUAL UNIT: TBD</text>
  <rect class="unknown" x="75" y="545" width="465" height="125" rx="5"/>
  <text class="txt small" x="100" y="577">MEASURE / PHOTOGRAPH:</text>
  <text class="txt small" x="100" y="607">speaker label • Ω • connector • drive</text>
  <text class="txt small" x="100" y="635">PCB/chips • motor • position feedback</text>
  <text class="txt ref" x="500" y="662">[120]</text>
  <text class="txt note" x="75" y="695">No standalone amplifier or 32 Ω reuse claim until measured.</text>

  <rect class="panel" x="600" y="475" width="955" height="385" rx="6"/>
  <text class="txt sub" x="625" y="511">C — PROJECT PROPOSAL: ONE AUDIO / TIMING CLOCK</text>
  <rect class="nodeC" x="635" y="545" width="240" height="90" rx="4"/>
  <text class="txt" x="664" y="578">CONVERSATION</text><text class="txt small" x="664" y="604">Hermes + TTS</text><text class="txt ref" x="837" y="628">[131]</text>
  <rect class="nodeC" x="970" y="545" width="260" height="90" rx="4"/>
  <text class="txt" x="998" y="578">PCM + EVENTS</text><text class="txt small" x="998" y="604">timestamp authority</text><text class="txt ref" x="1192" y="628">[132]</text>
  <path class="line cyan arrow" d="M875 590H970"/>

  <rect class="nodeC" x="635" y="705" width="240" height="95" rx="4"/>
  <text class="txt small" x="663" y="738">OBS PROGRAM AUDIO</text><text class="txt small" x="663" y="765">stream + record</text><text class="txt ref" x="837" y="792">[133]</text>
  <rect class="unknown" x="970" y="705" width="260" height="95" rx="4"/>
  <text class="txt small" x="998" y="738">LOCAL PLAYBACK</text><text class="txt small" x="998" y="765">amp + speaker TBD</text><text class="txt ref" x="1192" y="792">[134]</text>
  <rect class="nodeC" x="1320" y="705" width="200" height="95" rx="4"/>
  <text class="txt small" x="1347" y="738">FACE / AVATAR</text><text class="txt small" x="1347" y="765">bounded timing</text><text class="txt ref" x="1482" y="792">[135]</text>
  <path class="line cyan arrow" d="M1060 635V675H755V705"/>
  <path class="line cyan arrow" d="M1100 635V705"/>
  <path class="line cyan arrow" d="M1140 635V675H1420V705"/>
  <text class="txt note" x="625" y="837">Bluetooth may monitor early demos; it is not the authoritative face-sync clock.</text>

  <rect class="panel" x="45" y="885" width="1510" height="80" rx="4"/>
  <text class="txt small" x="70" y="918">EVIDENCE LEGEND:</text>
  <line class="line white" x1="250" y1="912" x2="310" y2="912"/><text class="txt small" x="325" y="918">PATENT-DESCRIBED</text>
  <line class="line muted dash" x1="540" y1="912" x2="600" y2="912"/><text class="txt small" x="615" y="918">ACTUAL-UNIT UNKNOWN</text>
  <line class="line cyan" x1="905" y1="912" x2="965" y2="912"/><text class="txt small" x="980" y="918">PROJECT PROPOSAL</text>
  <text class="txt tiny" x="70" y="948">CAUTION: SPEAKER REUSE IS TBD PENDING LABEL, DC RESISTANCE, CONNECTOR AND DIFFERENTIAL DRIVE MEASUREMENTS.</text>
</svg>
