name: Character foundation offline checks
on:
  pull_request:
    paths:
      - 'services/hermes-activity/**'
      - 'services/embodiment-gateway/**'
      - 'services/stream-supervisor/**'
      - 'services/camera-capture/**'
      - 'tools/kinect2/**'
      - 'tools/character-demo/**'
      - 'tools/verify-media.sh'
      - '.github/ci/**'
      - '.github/workflows/character-foundation.yml'
  push:
    branches: ['work/2-character-foundation']
    paths: ['services/**', 'tools/**', '.github/ci/**', '.github/workflows/character-foundation.yml']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.13.6'
          python-version: '3.12.16'
          enable-cache: false
      - name: Prepare frozen wheels without executing local build backends
        shell: bash
        run: |
          gate=$(mktemp -d /tmp/xeno-media-gate.XXXXXXXX)
          echo "XENO_GATE=$gate" >> "$GITHUB_ENV"
          mkdir -p "$gate"/{bin,home,repo,cache,python,godot}
          cp "$(command -v uv)" "$gate/bin/uv"
          tar --exclude=.git --exclude=.venv --exclude=.godot --exclude=__pycache__ -cf - . | tar -xf - -C "$gate/repo"
          curl --fail --location --retry 2 --max-time 120 \
            https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip \
            --output "$gate/godot.zip"
          echo "0b1a6c54c2c619c12e169fe9241edda4b81080b519451cec2984bf0d2c6cb73c  $gate/godot.zip" | sha256sum --check
          unzip -q "$gate/godot.zip" -d "$gate/godot"
          env -i PATH="$gate/bin:/usr/bin:/bin" HOME="$gate/home" \
            UV_PYTHON_INSTALL_DIR="$gate/python" UV_CACHE_DIR="$gate/cache" \
            bash -eu -s -- "$gate" <<'PREP'
          gate=$1
          for name in embodiment-gateway hermes-activity stream-supervisor; do
            uv sync --project "$gate/repo/services/$name" --python 3.12.16 --frozen --no-build --no-install-local
          done
          uv sync --python 3.12.16 --frozen --no-build --script "$gate/repo/services/camera-capture/tests/test_snapshot.py"
          for name in embodiment-gateway stream-supervisor; do
            uv pip install --python "$gate/repo/services/$name/.venv/bin/python" \
              --require-hashes --no-deps --only-binary :all: -r "$gate/repo/.github/ci/build-requirements.txt"
          done
          PREP
      - name: Run unchanged media gate in an isolated local-only worker
        shell: bash
        run: |
          gate=$XENO_GATE
          sudo useradd --uid 2001 --user-group --no-create-home --shell /usr/sbin/nologin xeno-media-check
          sudo chown -R 2001:2001 "$gate"
          # Separate UID and mount/PID/network namespaces; no privilege regain.
          # Gateway tests receive only synthetic PTYs and namespace loopback.
          sudo unshare --mount --net --pid --fork --mount-proc \
            bash -eu -s -- "$gate" <<'ISOLATE'
          gate=$1
          mount --make-rprivate /
          mount -t tmpfs -o mode=0700 tmpfs /home/runner
          mount -t tmpfs -o mode=0755 tmpfs /run
          mount -t tmpfs -o mode=0755 tmpfs /dev
          mknod -m 666 /dev/null c 1 3
          mknod -m 666 /dev/zero c 1 5
          mknod -m 666 /dev/random c 1 8
          mknod -m 666 /dev/urandom c 1 9
          mkdir /dev/pts /dev/shm
          mount -t devpts -o newinstance,ptmxmode=0666,mode=0620 devpts /dev/pts
          ln -s pts/ptmx /dev/ptmx
          ln -s /proc/self/fd /dev/fd
          ln -s /proc/self/fd/0 /dev/stdin
          ln -s /proc/self/fd/1 /dev/stdout
          ln -s /proc/self/fd/2 /dev/stderr
          mount -t tmpfs -o mode=1777 tmpfs /dev/shm
          ip link set lo up
          exec setpriv --reuid=2001 --regid=2001 --clear-groups --no-new-privs \
            --bounding-set=-all --inh-caps=-all --ambient-caps=-all \
            env -i PATH="$gate/bin:/usr/bin:/bin" HOME="$gate/home" \
            UV_PYTHON_INSTALL_DIR="$gate/python" UV_CACHE_DIR="$gate/cache" \
            UV_OFFLINE=1 UV_PYTHON_DOWNLOADS=never PYTHONNOUSERSITE=1 PYTHONDONTWRITEBYTECODE=1 \
            FURBOMEK_GODOT="$gate/godot/Godot_v4.7-stable_linux.x86_64" \
            bash -eu -s -- "$gate/repo" <<'CHECKS'
          cd "$1"
          for name in embodiment-gateway stream-supervisor; do
            uv pip install --python "services/$name/.venv/bin/python" --offline --no-deps --no-build-isolation -e "services/$name"
          done
          export UV_NO_SYNC=1
          bash tools/verify-media.sh
          "$FURBOMEK_GODOT" --headless --path tools/kinect2/godot --check-only --script res://character_render_runner.gd
          CHECKS
          ISOLATE
