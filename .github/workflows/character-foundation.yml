name: Character foundation offline checks
on:
  pull_request:
    paths:
      - 'services/hermes-activity/**'
      - 'services/embodiment-gateway/**'
      - 'services/stream-supervisor/**'
      - 'services/camera-capture/**'
      - 'tools/kinect2/**'
      - 'tools/character-demo/**'
      - 'tools/verify-media.sh'
      - '.github/ci/**'
      - '.github/workflows/character-foundation.yml'
  push:
    branches: ['main', 'work/2-character-foundation']
    paths: ['services/**', 'tools/**', '.github/ci/**', '.github/workflows/character-foundation.yml']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.13.6'
          python-version: '3.12.16'
          enable-cache: false
      - name: Prepare frozen wheels without executing local build backends
        shell: bash
        run: |
          set -euo pipefail
          gate=$(mktemp -d /tmp/xeno-media-gate.XXXXXXXX)
          echo "XENO_GATE=$gate" >> "$GITHUB_ENV"
          mkdir -p "$gate"/{bin,home,repo,python,godot}
          cp "$(command -v uv)" "$gate/bin/uv"
          # Install/find only a trusted interpreter, before inspecting candidate metadata.
          cd "$gate/home"
          env -i PATH="$gate/bin:/usr/bin:/bin" HOME="$gate/home" \
            UV_PYTHON_INSTALL_DIR="$gate/python" UV_NO_CONFIG=1 \
            uv --no-config python install 3.12.16
          python=$(env -i PATH="$gate/bin:/usr/bin:/bin" HOME="$gate/home" \
            UV_PYTHON_INSTALL_DIR="$gate/python" UV_NO_CONFIG=1 UV_PYTHON_DOWNLOADS=never \
            uv --no-config python find --managed-python 3.12.16)
          case "$python" in "$gate/python/"*) ;; *) exit 1 ;; esac
          printf '%s\n' "$python" > "$gate/python-path"
          cd "$GITHUB_WORKSPACE"
          tar --exclude=.git --exclude=.venv --exclude=.godot --exclude=__pycache__ -cf - . | tar -xf - -C "$gate/repo"
          curl --fail --location --retry 2 --max-time 120 \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip \
            --output "$gate/godot.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $gate/godot.zip" | sha256sum --check
          unzip -q "$gate/godot.zip" -d "$gate/godot"
          sudo useradd --uid 2001 --user-group --no-create-home --shell /usr/sbin/nologin xeno-media-check
          sudo chown -R 2001:2001 "$gate"
          # Preparation gets no runner home, runtime sockets, devices or inherited env.
          # Its network is available only for validated public-registry wheel inputs.
          sudo unshare --mount --pid --fork --mount-proc \
            bash -euo pipefail -s -- "$gate" "$python" <<'PREP_ISOLATE'
          gate=$1
          python=$2
          mount --make-rprivate /
          mount -t tmpfs -o mode=0700 tmpfs /home/runner
          mount -t tmpfs -o mode=0755 tmpfs /run
          mount -t tmpfs -o mode=0755 tmpfs /dev
          mknod -m 666 /dev/null c 1 3
          mknod -m 666 /dev/zero c 1 5
          mknod -m 666 /dev/random c 1 8
          mknod -m 666 /dev/urandom c 1 9
          exec setpriv --reuid=2001 --regid=2001 --clear-groups --no-new-privs \
            --bounding-set=-all --inh-caps=-all --ambient-caps=-all \
            env -i PATH="$gate/bin:/usr/bin:/bin" HOME="$gate/home" \
            UV_PYTHON_INSTALL_DIR="$gate/python" UV_CACHE_DIR="$gate/cache" \
            UV_PYTHON_DOWNLOADS=never UV_NO_CONFIG=1 PYTHONNOUSERSITE=1 \
            bash -euo pipefail -s -- "$gate" "$python" <<'PREP'
          gate=$1
          python=$2
          cd "$gate/home"
          mkdir "$gate/envs" "$gate/cache" "$gate/build-inputs"
          # Trusted inline parser: data only, no import/evaluation of candidate code.
          "$python" -I - "$gate/repo" <<'VALIDATE'
          from pathlib import Path
          import re
          import sys
          import tomllib
          from urllib.parse import urlsplit

          root = Path(sys.argv[1]).resolve(strict=True)
          def source_file(relative):
              lexical = root / relative
              path = lexical.resolve(strict=True)
              if path != lexical or not path.is_relative_to(root) or not path.is_file():
                  raise ValueError("candidate input symlink or source escape")
              return path

          def metadata(data):
              # These projects need no uv overrides. Reject all instead of allowing
              # unreviewed future settings, custom indexes, workspaces or sources.
              if data.get("tool", {}).get("uv"):
                  raise ValueError("uv configuration overrides are forbidden")
              def walk(value):
                  if isinstance(value, dict):
                      for key, item in value.items():
                          if key in {"sources", "index", "indexes", "workspace"}:
                              raise ValueError("dependency source override")
                          walk(item)
                  elif isinstance(value, list):
                      for item in value:
                          walk(item)
                  elif isinstance(value, str) and ("@" in value or "://" in value or value.startswith(("../", "/", "git+", "file:"))):
                      raise ValueError("non-registry metadata reference")
              # Only dependency-related metadata; ordinary project links are inert.
              for key in ("dependencies", "optional-dependencies", "dependency-groups", "build-system"):
                  walk(data.get(key, {}))
              project = data.get("project", {})
              walk(project.get("dependencies", []))
              walk(project.get("optional-dependencies", {}))

          def lock(data, project_name=None):
              packages = data.get("package")
              if not isinstance(packages, list) or not packages:
                  raise ValueError("missing package lock")
              for package in packages:
                  source = package.get("source")
                  local = source in ({"editable": "."}, {"virtual": "."})
                  if local:
                      if project_name is None or package.get("name") != project_name:
                          raise ValueError("local package is not current root project")
                  elif source != {"registry": "https://pypi.org/simple"}:
                      raise ValueError("non-PyPI package source")
              def walk(value):
                  if isinstance(value, dict):
                      for key, item in value.items():
                          if key == "url":
                              parsed = urlsplit(item)
                              if (parsed.scheme != "https" or parsed.netloc != "files.pythonhosted.org"
                                      or parsed.username or parsed.password or parsed.port
                                      or parsed.fragment or parsed.query
                                      or not re.fullmatch(r"sha256:[0-9a-f]{64}", value.get("hash", ""))):
                                  raise ValueError("unapproved artifact URL/hash")
                          if key in {"git", "path", "directory", "workspace", "index"}:
                              raise ValueError("non-registry lock reference")
                          if key in {"editable", "virtual"} and item != ".":
                              raise ValueError("non-root local dependency")
                          if key == "registry" and item != "https://pypi.org/simple":
                              raise ValueError("non-PyPI registry")
                          walk(item)
                  elif isinstance(value, list):
                      for item in value:
                          walk(item)
              walk(data)

          # Reject enclosing workspace/index configuration as well as leaf settings.
          for relative in ("pyproject.toml", "services/pyproject.toml",
                           "services/camera-capture/pyproject.toml",
                           "services/camera-capture/tests/pyproject.toml"):
              if (root / relative).exists() or (root / relative).is_symlink():
                  metadata(tomllib.loads(source_file(relative).read_text()))
          for name in ("embodiment-gateway", "hermes-activity", "stream-supervisor"):
              base = "services/" + name + "/"
              project = tomllib.loads(source_file(base + "pyproject.toml").read_text())
              metadata(project)
              lock(tomllib.loads(source_file(base + "uv.lock").read_text()), project["project"]["name"])
          script = "services/camera-capture/tests/test_snapshot.py"
          text = source_file(script).read_text()
          blocks = re.findall(r"(?m)^# /// script\n((?:#.*\n)*?)# ///$", text)
          if len(blocks) != 1:
              raise ValueError("expected one script metadata block")
          metadata(tomllib.loads("\n".join((line[2:] if line.startswith("# ") else line[1:]) for line in blocks[0].splitlines())))
          lock(tomllib.loads(source_file(script + ".lock").read_text()))
          # Requirements admit only exact pins and sha256 hashes, never pip options,
          # recursive includes, URLs or local paths. uv additionally enforces hashes.
          requirements = source_file(".github/ci/build-requirements.txt").read_text()
          for line in requirements.splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              if not re.fullmatch(r"(?:[A-Za-z0-9][A-Za-z0-9_.-]*==[A-Za-z0-9_.+!-]+|--hash=sha256:[0-9a-f]{64})(?:\s+\\)?", line):
                  raise ValueError("unapproved build requirement")
          print("PASS: public registry dependency inputs")
          VALIDATE
          for name in embodiment-gateway hermes-activity stream-supervisor; do
            UV_PROJECT_ENVIRONMENT="$gate/envs/$name" uv --no-config sync \
              --project "$gate/repo/services/$name" --python "$python" \
              --default-index https://pypi.org/simple --frozen --no-build --no-install-project
          done
          uv --no-config sync --python "$python" --default-index https://pypi.org/simple \
            --frozen --no-build --script "$gate/repo/services/camera-capture/tests/test_snapshot.py"
          # Never query a populated dependency interpreter while online.
          uv --no-config pip install --python "$python" --target "$gate/build-inputs" \
            --default-index https://pypi.org/simple --require-hashes --no-deps --only-binary :all: \
            -r "$gate/repo/.github/ci/build-requirements.txt"
          PREP
          PREP_ISOLATE
      - name: Run unchanged media gate in an isolated local-only worker
        shell: bash
        run: |
          gate=$XENO_GATE
          # Separate UID and mount/PID/network namespaces; no privilege regain.
          # Gateway tests receive only synthetic PTYs and namespace loopback.
          sudo unshare --mount --net --pid --fork --mount-proc \
            bash -eu -s -- "$gate" <<'ISOLATE'
          gate=$1
          mount --make-rprivate /
          mount -t tmpfs -o mode=0700 tmpfs /home/runner
          mount -t tmpfs -o mode=0755 tmpfs /run
          mount -t tmpfs -o mode=0755 tmpfs /dev
          mknod -m 666 /dev/null c 1 3
          mknod -m 666 /dev/zero c 1 5
          mknod -m 666 /dev/random c 1 8
          mknod -m 666 /dev/urandom c 1 9
          mkdir /dev/pts /dev/shm
          mount -t devpts -o newinstance,ptmxmode=0666,mode=0620 devpts /dev/pts
          ln -s pts/ptmx /dev/ptmx
          ln -s /proc/self/fd /dev/fd
          ln -s /proc/self/fd/0 /dev/stdin
          ln -s /proc/self/fd/1 /dev/stdout
          ln -s /proc/self/fd/2 /dev/stderr
          mount -t tmpfs -o mode=1777 tmpfs /dev/shm
          ip link set lo up
          exec setpriv --reuid=2001 --regid=2001 --clear-groups --no-new-privs \
            --bounding-set=-all --inh-caps=-all --ambient-caps=-all \
            env -i PATH="$gate/bin:/usr/bin:/bin" HOME="$gate/home" \
            UV_PYTHON_INSTALL_DIR="$gate/python" UV_CACHE_DIR="$gate/cache" \
            UV_OFFLINE=1 UV_PYTHON_DOWNLOADS=never UV_NO_CONFIG=1 PYTHONNOUSERSITE=1 PYTHONDONTWRITEBYTECODE=1 \
            FURBOMEK_GODOT="$gate/godot/Godot_v4.7.2-stable_linux.x86_64" \
            bash -eu -s -- "$gate/repo" <<'CHECKS'
          cd "$1"
          gate=$(dirname "$1")
          # Candidate environment links and editable hooks activate offline only.
          for name in embodiment-gateway hermes-activity stream-supervisor; do
            rm -rf -- "services/$name/.venv"
            ln -s "$gate/envs/$name" "services/$name/.venv"
          done
          for name in embodiment-gateway stream-supervisor; do
            site=$("services/$name/.venv/bin/python" -I -c 'import sysconfig; print(sysconfig.get_path("purelib"))')
            cp -R "$gate/build-inputs/." "$site/"
            uv --no-config pip install --python "services/$name/.venv/bin/python" --offline --no-deps --no-build-isolation -e "services/$name"
          done
          export UV_NO_SYNC=1
          bash tools/verify-media.sh
          "$FURBOMEK_GODOT" --headless --path tools/kinect2/godot --check-only --script res://character_render_runner.gd
          CHECKS
          ISOLATE
