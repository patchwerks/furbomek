name: Non-live verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: non-live-${{ github.ref }}
  cancel-in-progress: true
jobs:
  media:
    name: Locked media fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.11'
      - name: Install pinned verification tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-deps uv==0.11.7
          curl --fail --location --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/godot.zip"
          printf '%s  %s\n' cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4 "$RUNNER_TEMP/godot.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "FURBOMEK_GODOT=$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Run unchanged media gate and dispatcher regressions
        env:
          UV_PYTHON: '3.12.11'
          UV_PYTHON_DOWNLOADS: never
        run: bash tools/verify.sh dispatcher media
  native:
    name: Actuator-disabled native safety
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Provision immutable offline worker inputs
        shell: bash
        run: |
          set -euo pipefail
          docker pull gcc:13.3.0@sha256:50e85821c43ea2fd683bf5ae41f5d6981c41bab0641e7640962759291ceb7f78
          curl --fail --location --retry 3 https://github.com/BurntSushi/ripgrep/releases/download/15.1.0/ripgrep-15.1.0-x86_64-unknown-linux-musl.tar.gz -o "$RUNNER_TEMP/rg.tar.gz"
          printf '%s  %s\n' 1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599 "$RUNNER_TEMP/rg.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/native-tools"
          tar -xzf "$RUNNER_TEMP/rg.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/native-tools" ripgrep-15.1.0-x86_64-unknown-linux-musl/rg
      - name: Run native tests without credentials, network or device mounts
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --user "$(id -u):$(id -g)" \
            --cpus 2 --memory 2g --pids-limit 128 \
            --tmpfs /tmp:rw,exec,nosuid,size=512m \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/native-tools,target=/tools,readonly" \
            --workdir /workspace --env PATH=/tools:/usr/local/bin:/usr/bin:/bin \
            gcc:13.3.0@sha256:50e85821c43ea2fd683bf5ae41f5d6981c41bab0641e7640962759291ceb7f78 \
            bash -c 'test "$(g++ -dumpfullversion)" = 13.3.0 && bash tools/verify.sh robot-native'
  legacy:
    name: Legacy Nuxt build baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Install locked dependencies without lifecycle hooks
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix server --ignore-scripts --no-audit --no-fund
      - name: Report actual legacy build result
        run: bash tools/verify.sh legacy
