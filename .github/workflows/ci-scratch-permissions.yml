name: Fixed scratch permissions probe
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/ci-scratch-permissions.yml
      - tools/ci/worker.sh
      - tools/tests/test_ci_worker.py
      - tools/ci/README.md
permissions:
  contents: read
jobs:
  storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Compare default copy-up with nocopy under production workdir
        shell: bash
        run: |
          set -euo pipefail
          # Fixed trusted probe: no checkout, candidate scripts or host binds.
          python_image=python:3.12.11-bookworm@sha256:1b48a1b13ec678be8d84974541cc007d4367aaf01f985231daad1a940106efc0
          node_image=node:26.7.0-bookworm@sha256:e929171d35b9df7773a3ec5b068e387fa109441dc90f91e6560af5d39b7e9bf1
          docker_version=$(docker version --format '{{.Server.Version}}')
          if [[ ! $docker_version =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] ||
             (( 10#${BASH_REMATCH[1]:-0} < 28 )); then
            echo 'Require stable Docker Engine 28.0.0 or newer' >&2
            exit 2
          fi
          echo "Docker Engine $docker_version"
          docker pull "$python_image"
          docker pull "$node_image"
          volumes=()
          containers=()
          cleanup() {
            local rc=$? failed=0
            trap - EXIT
            for name in "${containers[@]}"; do
              docker rm -f "$name" >/dev/null 2>&1 || true
              if docker container inspect "$name" >/dev/null 2>&1; then failed=1; fi
            done
            for name in "${volumes[@]}"; do
              docker volume rm "$name" >/dev/null 2>&1 || true
              if docker volume inspect "$name" >/dev/null 2>&1; then failed=1; fi
            done
            if (( failed )); then echo 'Cleanup verification failed' >&2; exit 1; fi
            echo 'All probe containers and volumes removed'
            exit "$rc"
          }
          trap cleanup EXIT
          base=(--network none --read-only --cap-drop ALL
                --security-opt no-new-privileges --user 1000:1000)
          for language in python node; do
            image=$python_image
            if [[ $language == node ]]; then image=$node_image; fi
            for treatment in default nocopy; do
              volume="scratch-probe-${language}-${treatment}-$$"
              keeper="$volume-keeper"
              volumes+=("$volume")
              containers+=("$keeper")
              docker volume create --driver local --opt type=tmpfs --opt device=tmpfs \
                --opt o=size=4g,uid=1000,gid=1000,mode=0700 "$volume"
              mount="type=volume,source=$volume,target=/scratch"
              if [[ $treatment == nocopy ]]; then mount+=,volume-nocopy; fi
              docker run -d --name "$keeper" "${base[@]}" \
                --cpus 0.1 --memory 32m --pids-limit 8 --mount "$mount" \
                "$python_image" sleep infinity
              worker=(docker run --rm "${base[@]}" --cpus 2 --memory 4g
                      --pids-limit 256 --tmpfs /tmp:rw,exec,nosuid,size=512m
                      --mount "$mount" --workdir /scratch)
              echo "CASE $language $treatment"
              # Exit 42 is exclusively the expected default-mount write denial.
              # A container startup failure cannot masquerade as reproduction.
              set +e
              "${worker[@]}" "$image" sh -ec '
                test "$(id -u):$(id -g)" = 1000:1000
                test ! -e /var/run/docker.sock
                stat -c "scratch uid=%u gid=%g mode=%a" /scratch
                if ! (printf "%s\n" scratch-probe > /scratch/marker); then
                  echo "MARKER_WRITE_DENIED"
                  exit 42
                fi
                test "$(cat /scratch/marker)" = scratch-probe
                echo "MARKER_WRITTEN"
              '
              rc=$?
              set -e
              if [[ $treatment == default ]]; then
                test "$rc" = 42
              else
                test "$rc" = 0
                "${worker[@]}" "$image" sh -ec '
                  stat -c "scratch uid=%u gid=%g mode=%a" /scratch
                  test "$(stat -c "%u:%g:%a" /scratch)" = 1000:1000:700
                  test "$(cat /scratch/marker)" = scratch-probe
                  printf "%s\n" second-phase > /scratch/second-marker
                '
                "${worker[@]}" "$image" sh -ec '
                  test "$(cat /scratch/marker)" = scratch-probe
                  test "$(cat /scratch/second-marker)" = second-phase
                  echo "CROSS_PHASE_MARKERS_PRESERVED"
                '
              fi
              docker rm -f "$keeper"
              docker volume rm "$volume"
              ! docker container inspect "$keeper" >/dev/null 2>&1
              ! docker volume inspect "$volume" >/dev/null 2>&1
            done
          done

  worker-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run only worker argv fixtures inside disposable boundary
        shell: bash
        run: |
          set -euo pipefail
          python_image=python:3.12.11-bookworm@sha256:1b48a1b13ec678be8d84974541cc007d4367aaf01f985231daad1a940106efc0
          docker pull "$python_image"
          docker run --rm --network none --read-only --user 1000:1000 \
            --cap-drop ALL --security-opt no-new-privileges \
            --cpus 2 --memory 512m --pids-limit 64 \
            --tmpfs /tmp:rw,exec,nosuid,size=128m,uid=1000,gid=1000,mode=0700 \
            --mount "type=bind,source=$PWD/tools/ci/worker.sh,target=/work/tools/ci/worker.sh,readonly" \
            --mount "type=bind,source=$PWD/tools/tests/test_ci_worker.py,target=/work/tools/tests/test_ci_worker.py,readonly" \
            --workdir /work "$python_image" \
            env -i PATH=/usr/local/bin:/usr/bin:/bin HOME=/tmp TMPDIR=/tmp \
            python -B -c '
          import sys, unittest
          suite = unittest.defaultTestLoader.discover("tools/tests", pattern="test_ci_worker.py")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.testsRun != 9 or result.skipped or not result.wasSuccessful():
              sys.exit(1)
          '
